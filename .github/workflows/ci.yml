name: ci

on:
  pull_request:
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "helm/sample-api/templates/**"
      - "helm/sample-api/Chart.yaml"
      - "helm/sample-api/values.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint and unit-test the application
  # ---------------------------------------------------------------------------
  test:
    name: lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/test-results.xml

  # ---------------------------------------------------------------------------
  # 2. Validate the Helm chart for every environment
  # ---------------------------------------------------------------------------
  helm:
    name: helm lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Lint and schema-validate rendered manifests
        run: |
          for env in staging prod; do
            echo "::group::$env"
            helm lint helm/sample-api -f helm/sample-api/values-$env.yaml --strict
            helm template sample-api helm/sample-api -f helm/sample-api/values-$env.yaml \
              | kubeconform -strict -summary -kubernetes-version 1.31.0
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # 3. Build the image, scan it, and push it to GHCR (push only on main)
  # ---------------------------------------------------------------------------
  build:
    name: build, scan & push image
    needs: [test, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 8080:8080 ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/ | tee /dev/stderr | grep -q '"service":"sample-api"'
          docker rm -f api

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

  # ---------------------------------------------------------------------------
  # 4. GitOps: point staging at the new image by committing to Git.
  #    Argo CD notices the commit and rolls it out - CI never touches the cluster.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: update staging (GitOps)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gitops-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Bump image tag in values-staging.yaml
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' helm/sample-api/values-staging.yaml
          git diff

      - name: Commit and push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/sample-api/values-staging.yaml
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "deploy(staging): sample-api ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
