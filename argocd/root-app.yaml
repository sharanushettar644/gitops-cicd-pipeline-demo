# "App of apps": the only manifest applied by hand. Argo CD then manages
# everything under argocd/apps/ from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sharanushettar644/gitops-cicd-pipeline-demo.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
