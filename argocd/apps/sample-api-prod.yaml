apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sample-api
  source:
    repoURL: https://github.com/sharanushettar644/gitops-cicd-pipeline-demo.git
    targetRevision: main
    path: helm/sample-api
    helm:
      releaseName: sample-api
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-api-prod
  syncPolicy:
    # Git is the source of truth: drift is reverted and removed resources are pruned.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
